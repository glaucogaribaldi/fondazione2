[project]
name = "fondazionesemplice"
version = "0.1.0"
description = "Paper-first AI trading appliance with deterministic risk controls"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/decision-service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
